<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sorazGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>
    <filter id="popShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="0" flood-color="#0E121E" />
    </filter>
  </defs>

  <!-- Background Pill/Card with Brutalist border -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#sorazGrad)" stroke="#0E121E" stroke-width="3.5" filter="url(#popShadow)" />

  <!-- Asian Pop Japanese 'SO' (そ) / Sparkle Character in Bold White -->
  <path d="M22 22 C 28 20, 36 19, 42 21 C 36 26, 28 30, 24 37 C 21 42, 24 48, 30 48 C 36 48, 41 44, 43 39" 
        fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Pop Sparkle / Star in top-right (Acid Gold) -->
  <polygon points="45,12 47,17 52,19 47,21 45,26 43,21 38,19 43,17" fill="#E8FE38" stroke="#0E121E" stroke-width="1.2" />

  <!-- Pop bubble bottom-left (Cyan Fizz) -->
  <circle cx="16" cy="46" r="3.5" fill="#4DEEEA" stroke="#0E121E" stroke-width="1.2" />
</svg>
